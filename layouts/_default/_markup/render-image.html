{{ $image := .Page.Resources.GetMatch .Destination }}
{{ with $image }}
{{ $small := .Resize "720x webp" }}{{ $large := .Resize "1440x webp" }}
<img src="{{ $small.RelPermalink }}" srcset="{{ $small.RelPermalink }} 720w, {{ $large.RelPermalink }} 1440w" sizes="(max-width: 760px) 90vw, 680px" alt="{{ $.Text }}" width="{{ $small.Width }}" height="{{ $small.Height }}" loading="lazy" decoding="async">
{{ else }}<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" decoding="async">{{ end }}
