name: Build and check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Hugo
        run: |
          VERSION=$(cat .hugo-version)
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${VERSION}/hugo_${VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public/
