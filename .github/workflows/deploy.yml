name: Publish to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Hugo
        run: |
          VERSION=$(cat .hugo-version)
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${VERSION}/hugo_${VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
      - uses: actions/configure-pages@v5
      - run: python3 -m pip install -r tools/requirements-build.txt
      - run: make check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - uses: actions/deploy-pages@v4
        id: deployment
