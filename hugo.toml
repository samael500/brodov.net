baseURL = 'https://brodov.net/'
locale = 'ru-RU'
timeZone = 'Europe/Moscow'
defaultContentLanguage = 'ru'
title = 'Бродов нет'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
disableKinds = ['taxonomy', 'term']
[params]
  tagline = 'Журнал обыкновенных невероятностей'
  description = 'Журнал обыкновенных невероятностей. Истории из лесов и болот, заметки с кухни и рабочего стола.'
  author = 'Максим Скороход'
  contact = ''
  metrika_id = 112824105
[outputs]
  home = ['HTML', 'RSS']
[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
[imaging]
  resampleFilter = 'Lanczos'
[imaging.webp]
  quality = 85
[imaging.jpeg]
  quality = 85

[pagination]
  pagerSize = 10
[[module.mounts]]
  source = 'content'
  target = 'content'
[[module.mounts]]
  source = '.shorts-generated'
  target = 'content'

# Shared resources are pinned by vendor/brodov-style, not copied editable sources.
[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = 'data'
  target = 'data'
[[module.mounts]]
  source = 'vendor/brodov-style/fonts'
  target = 'assets/fonts'
[[module.mounts]]
  source = 'vendor/brodov-style/brand'
  target = 'assets/images'
  files = ['*.png']
[[module.mounts]]
  source = 'vendor/brodov-style/css'
  target = 'static/brodov-style/css'
[[module.mounts]]
  source = 'vendor/brodov-style/fonts'
  target = 'static/brodov-style/fonts'
  files = ['*.woff2']
[[module.mounts]]
  source = 'vendor/brodov-style/brand/paper-grain.png'
  target = 'static/brodov-style/brand/paper-grain.png'
[[module.mounts]]
  source = 'vendor/brodov-style/tokens.json'
  target = 'data/brodov_style.json'
